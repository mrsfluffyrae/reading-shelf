name: Refresh Cozy Profile Card

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  push:
    paths:
      - 'data/shelf.json'
      - 'generate_card.py'
  workflow_dispatch:      # Lets you click "Run workflow" manually whenever you want

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Card SVG
        run: python generate_card.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/card.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "🌸 Refresh cozy profile card" && git push)